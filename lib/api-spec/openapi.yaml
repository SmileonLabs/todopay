openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TodoPay API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: members
    description: Member management
  - name: virtual-accounts
    description: Virtual account management
  - name: withdrawals
    description: Withdrawal requests
  - name: transactions
    description: Account transactions
  - name: balances
    description: Balance and charging management
  - name: fees
    description: Fee configuration
  - name: statistics
    description: Daily statistics
  - name: notices
    description: Notice board
  - name: otp
    description: OTP settings
  - name: external-payment-intents
    description: Server-to-server merchant payment intent API

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  # Users (Admin hierarchy)
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: parentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset user password
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset

  /users/{id}/permission:
    patch:
      operationId: updateUserPermission
      tags: [users]
      summary: Update user permission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPermissionUpdate"
      responses:
        "200":
          description: Permission updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  # Members (회원)
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List members
      parameters:
        - name: storeCode
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
    post:
      operationId: createMember
      tags: [members]
      summary: Register member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}/status:
    patch:
      operationId: updateMemberStatus
      tags: [members]
      summary: Update member status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Status updated

  /members/{id}/virtual-account:
    post:
      operationId: reissueMemberVirtualAccount
      tags: [members]
      summary: Reissue virtual account for member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reissued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/register-link:
    get:
      operationId: getMemberRegisterLink
      tags: [members]
      summary: Get member registration link
      responses:
        "200":
          description: Registration link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterLink"

  # Virtual Accounts
  /virtual-accounts:
    get:
      operationId: listVirtualAccounts
      tags: [virtual-accounts]
      summary: List virtual accounts
      parameters:
        - name: memberId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of virtual accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualAccountList"

  /virtual-accounts/{id}:
    get:
      operationId: getVirtualAccount
      tags: [virtual-accounts]
      summary: Get virtual account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Virtual account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualAccount"

  # Withdrawals (출금 요청)
  /withdrawals:
    get:
      operationId: listWithdrawals
      tags: [withdrawals]
      summary: List withdrawal requests
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: approvalStatus
          in: query
          schema:
            type: string
        - name: withdrawalStatus
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of withdrawals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalList"
    post:
      operationId: createWithdrawal
      tags: [withdrawals]
      summary: Create withdrawal request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /withdrawals/{id}/approve:
    post:
      operationId: approveWithdrawal
      tags: [withdrawals]
      summary: Approve withdrawal request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /withdrawals/{id}/reject:
    post:
      operationId: rejectWithdrawal
      tags: [withdrawals]
      summary: Reject withdrawal request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /withdrawals/{id}/pay:
    post:
      operationId: markWithdrawalPaid
      tags: [withdrawals]
      summary: Mark an approved withdrawal as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /withdrawals/summary:
    get:
      operationId: getWithdrawalSummary
      tags: [withdrawals]
      summary: Get withdrawal summary totals
      responses:
        "200":
          description: Withdrawal summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSummary"

  # Transactions (계좌 입출금 내역)
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List account transactions
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: storeId
          in: query
          schema:
            type: integer
        - name: agencyId
          in: query
          schema:
            type: integer
        - name: distributorId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"

  /transactions/{id}/confirm:
    post:
      operationId: confirmTransaction
      tags: [transactions]
      summary: Confirm a pending deposit transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: integer
                  status:
                    type: string

  # Balances (충전금액 관리)
  /balances:
    get:
      operationId: listBalanceRecords
      tags: [balances]
      summary: List balance records
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of balance records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceRecordList"
    post:
      operationId: createBalanceRecord
      tags: [balances]
      summary: Create manual balance record (충전/조정)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceRecordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceRecord"

  /balances/summary:
    get:
      operationId: getBalanceSummary
      tags: [balances]
      summary: Get balance summary (잔액, 지급보류)
      responses:
        "200":
          description: Balance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSummary"

  # Store balance (매장 잔액)
  /store/{id}/balance:
    get:
      operationId: getStoreBalance
      tags: [withdrawals]
      summary: Get store balance (구매 확인 적립 잔액)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Store balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreBalance"

  # Settlements (수수료 정산)
  /settlements/summary:
    get:
      operationId: getSettlementSummary
      tags: [settlements]
      summary: Get settlement summary (role-aware)
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Settlement summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementSummary"

  /settlements/records:
    get:
      operationId: listSettlementRecords
      tags: [settlements]
      summary: List settlement records (role-aware)
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Settlement records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementRecordList"

  # Fees (수수료 설정)
  /fees:
    get:
      operationId: listFees
      tags: [fees]
      summary: List fee configurations for subordinates by role
      parameters:
        - name: parentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: role
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Fee configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeeListItem"
    post:
      operationId: createFeeConfig
      tags: [fees]
      summary: Create fee configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeConfigInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeConfig"

  /fees/{id}:
    patch:
      operationId: updateFeeConfig
      tags: [fees]
      summary: Update fee configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeConfigUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeConfig"

  # Statistics (일자별 통계)
  /statistics/daily:
    get:
      operationId: getDailyStatistics
      tags: [statistics]
      summary: Get daily statistics
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Daily statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyStatistic"

  /statistics/overview:
    get:
      operationId: getStatisticsOverview
      tags: [statistics]
      summary: Get statistics overview (dashboard summary)
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsOverview"

  # Notices (공지사항)
  /notices:
    get:
      operationId: listNotices
      tags: [notices]
      summary: List notices
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of notices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeList"
    post:
      operationId: createNotice
      tags: [notices]
      summary: Create notice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notice"

  /notices/{id}:
    get:
      operationId: getNotice
      tags: [notices]
      summary: Get notice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notice"
    patch:
      operationId: updateNotice
      tags: [notices]
      summary: Update notice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notice"
    delete:
      operationId: deleteNotice
      tags: [notices]
      summary: Delete notice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # OTP
  /otp/settings:
    get:
      operationId: getOtpSettings
      tags: [otp]
      summary: Get OTP settings
      responses:
        "200":
          description: OTP settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSettings"
    patch:
      operationId: updateOtpSettings
      tags: [otp]
      summary: Update OTP settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpSettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSettings"

  /external/v1/payment-intents:
    post:
      operationId: createExternalPaymentIntent
      tags: [external-payment-intents]
      summary: Create an idempotent merchant order payment intent
      parameters:
        - $ref: "#/components/parameters/TodoPayApiKey"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntentCreateInput"
      responses:
        "201":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "200":
          description: Existing result returned for an identical idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "409":
          description: Idempotency key or merchant order conflict
    get:
      operationId: getExternalPaymentIntentByMerchantOrder
      tags: [external-payment-intents]
      summary: Get a payment intent by merchant order ID
      parameters:
        - $ref: "#/components/parameters/TodoPayApiKey"
        - name: merchantOrderId
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
        - name: attemptNumber
          in: query
          required: false
          description: When omitted, returns the latest attempt for the merchant order.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Payment intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "404":
          description: Payment intent not found

  /external/v1/payment-intents/{id}:
    get:
      operationId: getExternalPaymentIntent
      tags: [external-payment-intents]
      summary: Get a payment intent by TodoPay ID
      parameters:
        - $ref: "#/components/parameters/TodoPayApiKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^pi_[a-f0-9]{32}$'
      responses:
        "200":
          description: Payment intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "404":
          description: Payment intent not found

  /external/v1/payment-intents/{id}/cancel:
    post:
      operationId: cancelExternalPaymentIntent
      tags: [external-payment-intents]
      summary: Cancel an unpaid payment intent
      parameters:
        - $ref: "#/components/parameters/TodoPayApiKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^pi_[a-f0-9]{32}$'
      responses:
        "200":
          description: Cancelled payment intent, or the existing cancelled result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "409":
          description: Payment intent is no longer cancellable

  /external/v1/payment-intents/{id}/member:
    post:
      operationId: attachExternalPaymentIntentMember
      tags: [external-payment-intents]
      summary: Attach an active verified TodoPay member and virtual account
      description: Transitions only requires_member to awaiting_deposit. Repeating the same member after attachment is idempotent; a different member is rejected.
      parameters:
        - $ref: "#/components/parameters/TodoPayApiKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^pi_[a-f0-9]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId]
              additionalProperties: false
              properties:
                memberId:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Member attached, or the identical established binding returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "404":
          description: Payment intent not found in the authenticated merchant
        "409":
          description: Member or virtual account is not ready, a different member is already bound, or the state is not attachable

webhooks:
  paymentIntentEvent:
    post:
      summary: Planned signed TodoPay payment intent event callback
      description: Delivery activation is separate from this contract. Verify the TodoPay HMAC headers against the exact raw body and deduplicate by event ID.
      parameters:
        - name: X-TodoPay-Event-Id
          in: header
          required: true
          schema: { type: string }
        - name: X-TodoPay-Event-Type
          in: header
          required: true
          schema: { type: string }
        - name: X-TodoPay-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: X-TodoPay-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^v1=[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntentWebhookEvent"
      responses:
        "200":
          description: Event accepted or already processed

components:
  parameters:
    TodoPayApiKey:
      name: X-TodoPay-Api-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^tp_live_[A-Za-z0-9_-]{32,}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
  schemas:
    PaymentIntentCreateInput:
      type: object
      required: [merchantOrderId, amount]
      properties:
        merchantOrderId:
          type: string
          maxLength: 100
          pattern: '^[A-Za-z0-9._:-]+$'
        externalCustomerId:
          type: string
          maxLength: 100
        memberId:
          type: integer
          minimum: 1
        attemptNumber:
          type: integer
          minimum: 1
          maximum: 999999
          default: 1
          description: Increment only for a deliberate new payment attempt for the same merchant order.
        amount:
          type: string
          description: Positive whole KRW amount. JSON numbers and fractional values are rejected.
          pattern: '^[1-9][0-9]{0,14}$'
        currency:
          type: string
          const: KRW
          default: KRW
        expiresAt:
          type: string
          format: date-time
          description: Between 5 minutes and 30 days from creation. Defaults to 24 hours.
        description:
          type: string
          maxLength: 200
        metadata:
          type: object
          additionalProperties: true
          description: Maximum canonical JSON size is 8192 bytes. Do not include secrets or unnecessary personal data.
      anyOf:
        - required: [memberId]
        - required: [externalCustomerId]

    PaymentIntent:
      type: object
      required: [id, merchantOrderId, amount, currency, status, expiresAt, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: '^pi_[a-f0-9]{32}$' }
        merchantOrderId: { type: string }
        attemptNumber: { type: integer, minimum: 1 }
        externalCustomerId: { type: [string, "null"] }
        memberId: { type: [integer, "null"] }
        amount: { type: string, pattern: '^[1-9][0-9]*$' }
        currency: { type: string, const: KRW }
        status:
          type: string
          enum: [requires_member, awaiting_deposit, processing, succeeded, amount_mismatch, expired, cancelled, reversed]
        trackingNumber:
          type: [string, "null"]
          maxLength: 50
          description: KPPay trackId derived from merchant order ID and attempt number. It is not registered with KPPay until the explicit live-binding phase.
        expiresAt: { type: string, format: date-time }
        virtualAccount:
          oneOf:
            - $ref: "#/components/schemas/PaymentIntentVirtualAccount"
            - type: "null"
        description: { type: [string, "null"] }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PaymentIntentVirtualAccount:
      type: object
      required: [bankName, accountNumber, status]
      properties:
        bankName: { type: string }
        accountNumber: { type: string }
        status: { type: string }

    PaymentIntentWebhookEvent:
      type: object
      required: [id, type, createdAt, data]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [payment_intent.created, payment_intent.awaiting_deposit, payment_intent.succeeded, payment_intent.amount_mismatch, payment_intent.expired, payment_intent.cancelled, payment_intent.reversed]
        createdAt: { type: string, format: date-time }
        data:
          type: object
          required: [paymentIntentId, merchantOrderId, amount, currency, status, occurredAt]
          properties:
            paymentIntentId: { type: string }
            merchantOrderId: { type: string }
            externalCustomerId: { type: [string, "null"] }
            memberId: { type: [integer, "null"] }
            amount: { type: string, pattern: '^[1-9][0-9]*$' }
            currency: { type: string, const: KRW }
            status: { type: string }
            trackingNumber: { type: [string, "null"] }
            transactionId: { type: [integer, "null"] }
            providerTransactionId: { type: [string, "null"] }
            receivedAmount: { type: [string, "null"], pattern: '^[1-9][0-9]*$' }
            occurredAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # Auth
    LoginInput:
      type: object
      required: [loginId, password]
      properties:
        loginId:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        token:
          type: string

    # Admin Users
    AdminUser:
      type: object
      required: [id, loginId, name, role, permission, isActive, useOtp, createdAt]
      properties:
        id:
          type: integer
        loginId:
          type: string
        name:
          type: string
        role:
          type: string
          description: "superadmin | hq | distributor | agency | store"
        permission:
          type: string
          description: "readonly | admin | finance"
        isActive:
          type: boolean
        useOtp:
          type: boolean
        parentId:
          type: ["integer", "null"]
        parentName:
          type: ["string", "null"]
        createdAt:
          type: string

    AdminUserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer

    AdminUserInput:
      type: object
      required: [loginId, password, name, role, permission]
      properties:
        loginId:
          type: string
        password:
          type: string
        name:
          type: string
        role:
          type: string
        permission:
          type: string
        parentId:
          type: ["integer", "null"]
        useOtp:
          type: boolean

    AdminUserUpdate:
      type: object
      properties:
        name:
          type: string
        isActive:
          type: boolean
        permission:
          type: string
        useOtp:
          type: boolean

    ResetPasswordInput:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string

    UserPermissionUpdate:
      type: object
      required: [permission]
      properties:
        permission:
          type: string

    # Members
    Member:
      type: object
      required: [id, loginId, name, phone, isActive, isVerified, createdAt]
      properties:
        id:
          type: integer
        loginId:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        storeCode:
          type: ["string", "null"]
        storeName:
          type: ["string", "null"]
        birthdate:
          type: ["string", "null"]
        isVerified:
          type: boolean
        isActive:
          type: boolean
        virtualAccountNumber:
          type: ["string", "null"]
        virtualAccountBank:
          type: ["string", "null"]
        virtualAccountStatus:
          type: ["string", "null"]
          description: "active | revoked"
        createdAt:
          type: string

    MemberList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        total:
          type: integer

    MemberInput:
      type: object
      required: [loginId, password, name, phone, storeCode]
      properties:
        loginId:
          type: string
        password:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        storeCode:
          type: string
        birthdate:
          type: ["string", "null"]

    MemberUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        birthdate:
          type: ["string", "null"]
        isActive:
          type: boolean

    StatusUpdate:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean

    RegisterLink:
      type: object
      required: [url]
      properties:
        url:
          type: string

    # Virtual Accounts
    VirtualAccount:
      type: object
      required: [id, accountNumber, bankName, status, memberId, memberName, createdAt]
      properties:
        id:
          type: integer
        accountNumber:
          type: string
        bankName:
          type: string
        status:
          type: string
          description: "active | revoked"
        memberId:
          type: integer
        memberName:
          type: string
        createdAt:
          type: string

    VirtualAccountList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VirtualAccount"
        total:
          type: integer

    # Withdrawals
    Withdrawal:
      type: object
      required: [id, trackingNumber, amount, fee, totalAmount, approvalStatus, withdrawalStatus, accountNumber, accountBank, accountHolder, createdAt]
      properties:
        id:
          type: integer
        trackingNumber:
          type: string
        amount:
          type: number
        fee:
          type: number
        totalAmount:
          type: number
        approvalStatus:
          type: string
          description: "pending | approved | rejected"
        withdrawalStatus:
          type: string
          description: "unpaid | paid"
        accountNumber:
          type: string
        accountBank:
          type: string
        accountHolder:
          type: string
        rejectReason:
          type: ["string", "null"]
        memberName:
          type: ["string", "null"]
        storeName:
          type: ["string", "null"]
        storeId:
          type: ["integer", "null"]
        availableAt:
          type: ["string", "null"]
          description: "익일 오전 10시 KST (출금 승인 가능 시각)"
        createdAt:
          type: string

    WithdrawalList:
      type: object
      required: [items, total, totalAmount, totalFee]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Withdrawal"
        total:
          type: integer
        totalAmount:
          type: number
        totalFee:
          type: number

    WithdrawalInput:
      type: object
      required: [amount, accountNumber, accountBank, accountHolder]
      properties:
        amount:
          type: number
        accountNumber:
          type: string
        accountBank:
          type: string
        accountHolder:
          type: string

    RejectInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    WithdrawalSummary:
      type: object
      required: [pendingCount, pendingAmount, approvedCount, approvedAmount, todayWithdrawn]
      properties:
        pendingCount:
          type: integer
        pendingAmount:
          type: number
        approvedCount:
          type: integer
        approvedAmount:
          type: number
        todayWithdrawn:
          type: number

    # Transactions
    Transaction:
      type: object
      required: [id, type, originalAmount, amount, fee, status, fromAccount, toAccount, trackingNumber, pgTransactionId, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          description: "deposit | withdrawal"
        originalAmount:
          type: number
        amount:
          type: number
        fee:
          type: number
        status:
          type: string
          description: "success | failed | pending"
        fromAccount:
          type: string
        toAccount:
          type: string
        trackingNumber:
          type: string
        pgTransactionId:
          type: string
        memberName:
          type: ["string", "null"]
        memberId:
          type: ["integer", "null"]
        storeName:
          type: ["string", "null"]
        storeId:
          type: ["integer", "null"]
        agencyName:
          type: ["string", "null"]
        agencyId:
          type: ["integer", "null"]
        distributorName:
          type: ["string", "null"]
        distributorId:
          type: ["integer", "null"]
        hqName:
          type: ["string", "null"]
        hqId:
          type: ["integer", "null"]
        createdAt:
          type: string

    TransactionList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer

    # Balances
    BalanceRecord:
      type: object
      required: [id, direction, category, amount, balance, createdAt]
      properties:
        id:
          type: integer
        direction:
          type: string
          description: "in | out"
        category:
          type: string
          description: "deposit | withdrawal | charge | adjustment | payment"
        amount:
          type: number
        balance:
          type: number
        description:
          type: ["string", "null"]
        createdAt:
          type: string

    BalanceRecordInput:
      type: object
      required: [direction, category, amount]
      properties:
        direction:
          type: string
          description: "in | out"
        category:
          type: string
          description: "charge | adjustment"
        amount:
          type: number
        description:
          type: string

    BalanceRecordList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BalanceRecord"
        total:
          type: integer

    BalanceSummary:
      type: object
      required: [balance, pendingAmount]
      properties:
        balance:
          type: number
        pendingAmount:
          type: number

    # Store balance
    StoreBalance:
      type: object
      required: [storeId, balance]
      properties:
        storeId:
          type: integer
        balance:
          type: number
          description: "매장 잔액 (구매 확인 적립금)"

    # Settlements
    SettlementSummary:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [income, expense]
        totalIncome:
          type: number
        totalDeposit:
          type: number
        totalFee:
          type: number
        totalNet:
          type: number
        txCount:
          type: integer
        recordCount:
          type: integer

    SettlementRecord:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: integer
        amount:
          type: number
          nullable: true
        description:
          type: string
          nullable: true
        originalAmount:
          type: number
          nullable: true
        fee:
          type: number
          nullable: true
        trackingNumber:
          type: string
          nullable: true
        createdAt:
          type: string

    SettlementRecordList:
      type: object
      required: [type, items, total]
      properties:
        type:
          type: string
          enum: [income, expense]
        items:
          type: array
          items:
            $ref: "#/components/schemas/SettlementRecord"
        total:
          type: integer

    # Fees
    FeeListItem:
      type: object
      required: [userId, userLoginId, userName, role]
      properties:
        userId:
          type: integer
        userLoginId:
          type: string
        userName:
          type: string
        role:
          type: string
        parentId:
          type: ["integer", "null"]
        parentName:
          type: ["string", "null"]
        parentLoginId:
          type: ["string", "null"]
        feeConfigId:
          type: ["integer", "null"]
        depositFee:
          type: ["number", "null"]
          description: "입금 건당 수수료 (정액, 원/건)"
        withdrawalFee:
          type: ["number", "null"]
          description: "출금 건당 수수료 (정액, 원/건)"
        usageFeeRate:
          type: ["number", "null"]
          description: "이용 수수료율 (%)"
        parentDepositFee:
          type: ["number", "null"]
        parentWithdrawalFee:
          type: ["number", "null"]
        parentUsageFeeRate:
          type: ["number", "null"]

    FeeConfig:
      type: object
      required: [id, userId, userName, role, depositFee, withdrawalFee, usageFeeRate, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        role:
          type: string
        depositFee:
          type: number
          description: "입금 건당 수수료 (정액, 원/건)"
        withdrawalFee:
          type: number
          description: "출금 건당 수수료 (정액, 원/건)"
        usageFeeRate:
          type: number
          description: "이용 수수료율 (%)"
        createdAt:
          type: string

    FeeConfigInput:
      type: object
      required: [userId, depositFee, withdrawalFee]
      properties:
        userId:
          type: integer
        depositFee:
          type: number
        withdrawalFee:
          type: number
        usageFeeRate:
          type: number

    FeeConfigUpdate:
      type: object
      properties:
        depositFee:
          type: number
        withdrawalFee:
          type: number
        usageFeeRate:
          type: number

    # Statistics
    DailyStatistic:
      type: object
