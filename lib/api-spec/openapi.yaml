      properties:
        date:
          type: string
        depositCount:
          type: integer
        depositAmount:
          type: number
        withdrawalCount:
          type: integer
        withdrawalAmount:
          type: number
        feeAmount:
          type: number
        netAmount:
          type: number

    StatisticsOverview:
      type: object
      required: [todayDeposit, todayWithdrawal, todayFee, monthDeposit, monthWithdrawal, totalMembers, activeVirtualAccounts, pendingWithdrawals]
      properties:
        todayDeposit:
          type: number
        todayWithdrawal:
          type: number
        todayFee:
          type: number
        monthDeposit:
          type: number
        monthWithdrawal:
          type: number
        totalMembers:
          type: integer
        activeVirtualAccounts:
          type: integer
        pendingWithdrawals:
          type: integer

    # Notices
    Notice:
      type: object
      required: [id, title, content, isPinned, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        isPinned:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    NoticeList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
        total:
          type: integer

    NoticeInput:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string
        isPinned:
          type: boolean

    NoticeUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        isPinned:
          type: boolean

    # OTP
    OtpSettings:
      type: object
      required: [useOtpForDeposit, useOtpForWithdrawal]
      properties:
        useOtpForDeposit:
          type: boolean
        useOtpForWithdrawal:
          type: boolean
        otpSecret:
          type: ["string", "null"]

    OtpSettingsUpdate:
      type: object
      properties:
        useOtpForDeposit:
          type: boolean
        useOtpForWithdrawal:
          type: boolean
