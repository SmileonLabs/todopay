AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 and CloudFront frontend for TodoPay with an API proxy behavior.

Parameters:
  BucketName: { Type: String }
  CertificateArn: { Type: String }
  ApiOriginDomain: { Type: String, Default: api.todopay.io }

Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: todopay-web-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: todopay-static-cache-v1
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
  ApiNoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: todopay-api-no-cache-v1
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: todopay-api-all-viewer-except-host-v1
        CookiesConfig: { CookieBehavior: all }
        HeadersConfig: { HeaderBehavior: allViewer }
        QueryStringsConfig: { QueryStringBehavior: all }
  SpaRouteRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: todopay-spa-route-rewrite
      AutoPublish: true
      FunctionConfig: { Comment: Rewrite client-side routes without touching API paths, Runtime: cloudfront-js-1.0 }
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var normalized = uri.length > 1 && uri.endsWith('/') ? uri.slice(0, -1) : uri;
          var legacyAdminPrefixes = [
            '/login', '/dashboard', '/withdrawals', '/transactions', '/balances',
            '/settlement', '/members', '/users', '/fees', '/statistics', '/notices',
            '/otp', '/profile'
          ];
          for (var i = 0; i < legacyAdminPrefixes.length; i++) {
            var prefix = legacyAdminPrefixes[i];
            if (normalized === prefix || normalized.startsWith(prefix + '/')) {
              return {
                statusCode: 302,
                statusDescription: 'Found',
                headers: {
                  location: { value: 'https://partner.todopay.io/' },
                  'cache-control': { value: 'no-store' }
                }
              };
            }
          }
          if (!uri.startsWith('/api/') && !uri.includes('.')) request.uri = '/index.html';
          return request;
        }
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: todopay-security-headers-v1
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.todopay.io"
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: no-referrer, Override: true }
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: [todopay.io]
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
          - Id: api
            DomainName: !Ref ApiOriginDomain
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: !Ref StaticCachePolicy
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRouteRewrite.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiNoCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            Compress: true
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition: { StringEquals: { "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}" } }

Outputs:
  BucketName: { Value: !Ref WebBucket }
  DistributionId: { Value: !Ref Distribution }
  DistributionDomainName: { Value: !GetAtt Distribution.DomainName }
