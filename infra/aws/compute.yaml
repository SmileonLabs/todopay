AWSTemplateFormatVersion: "2010-09-09"
Description: Public ALB and private ECS API service for TodoPay production.

Parameters:
  EnvironmentName: { Type: String, Default: todopay-prod }
  VpcId: { Type: AWS::EC2::VPC::Id }
  PublicSubnetA: { Type: AWS::EC2::Subnet::Id }
  PublicSubnetC: { Type: AWS::EC2::Subnet::Id }
  AppSubnetA: { Type: AWS::EC2::Subnet::Id }
  AppSubnetC: { Type: AWS::EC2::Subnet::Id }
  LoadBalancerSecurityGroup: { Type: AWS::EC2::SecurityGroup::Id }
  ApplicationSecurityGroup: { Type: AWS::EC2::SecurityGroup::Id }
  CertificateArn: { Type: String }
  ApiImage: { Type: String }
  MigrationImage: { Type: String }
  DatabaseUrlSecretArn: { Type: String }
  RedisUrlSecretArn: { Type: String }
  SessionSecretArn: { Type: String }
  KpPaySecretArn: { Type: String }
  WebhookMasterSecretArn: { Type: String }
  AccessLogsBucket: { Type: String, Default: "" }
  AccessLogsPrefix: { Type: String, Default: alb }
  CorsOrigins:
    Type: String
    Default: "https://todopay.io,https://api.todopay.io,https://platform.todopay.io,https://partner.todopay.io,https://admin.sellink.todopay.io"
  DesiredCount: { Type: Number, Default: 0, MinValue: 0, MaxValue: 8 }
  MinCapacity: { Type: Number, Default: 0, MinValue: 0, MaxValue: 8 }
  MaxCapacity: { Type: Number, Default: 8, MinValue: 1, MaxValue: 16 }

Resources:
  MigrationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/ecs/${EnvironmentName}/migration", RetentionInDays: 90 }
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: "sts:AssumeRole" }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: ReadRuntimeSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["secretsmanager:GetSecretValue"]
                Resource: [!Ref DatabaseUrlSecretArn, !Ref RedisUrlSecretArn, !Ref SessionSecretArn, !Ref KpPaySecretArn, !Ref WebhookMasterSecretArn]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: "sts:AssumeRole" }]
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${EnvironmentName}-api"
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetC]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: routing.http.desync_mitigation_mode, Value: defensive }
        - { Key: deletion_protection.enabled, Value: "true" }
        - { Key: access_logs.s3.enabled, Value: "true" }
        - { Key: access_logs.s3.bucket, Value: !Ref AccessLogsBucket }
        - { Key: access_logs.s3.prefix, Value: !Ref AccessLogsPrefix }
  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckEnabled: true
      HealthCheckPath: /api/healthz
      HealthCheckIntervalSeconds: 20
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: [{ Type: redirect, RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 } }]
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref ApiTargetGroup }]
  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-api"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          Essential: true
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: HOST, Value: 0.0.0.0 }
            - { Name: PORT, Value: "8080" }
            - { Name: TRUST_PROXY, Value: "true" }
            - { Name: REQUIRE_REDIS, Value: "true" }
            # Production protection against repeated administrator login attempts.
            - { Name: ADMIN_LOGIN_RATE_LIMIT_ENABLED, Value: "true" }
            - { Name: CORS_ORIGINS, Value: !Ref CorsOrigins }
            - { Name: KP_PAY_WEBHOOK_IPS, Value: "112.175.152.181" }
            # KPPay production access has been approved. Real calls remain
            # operator-initiated and are verified through controlled tests.
            - { Name: PAYMENT_PROVIDER_ENABLED, Value: "true" }
            - { Name: WEBHOOK_DISPATCH_ENABLED, Value: "true" }
            - { Name: WEBHOOK_DISPATCH_INTERVAL_MS, Value: "2000" }
            - { Name: PAYOUT_WORKER_ENABLED, Value: "true" }
            - { Name: PAYOUT_WORKER_INTERVAL_MS, Value: "1000" }
            - { Name: PAYMENT_EVENT_WORKER_ENABLED, Value: "true" }
            - { Name: PAYMENT_EVENT_WORKER_INTERVAL_MS, Value: "500" }
            - { Name: PAYMENT_EVENT_WORKER_CONCURRENCY, Value: "5" }
            - { Name: RECONCILIATION_WORKER_ENABLED, Value: "true" }
            - { Name: RECONCILIATION_INTERVAL_MS, Value: "900000" }
            - { Name: REQUIRE_FINANCE_MFA, Value: "true" }
          Secrets:
            - { Name: DATABASE_URL, ValueFrom: !Ref DatabaseUrlSecretArn }
            - { Name: REDIS_URL, ValueFrom: !Ref RedisUrlSecretArn }
            - { Name: SESSION_SECRET, ValueFrom: !Ref SessionSecretArn }
            - { Name: KP_PAY_MERCHANT_ID, ValueFrom: !Sub "${KpPaySecretArn}:merchantId::" }
            - { Name: KP_PAY_VIRTUAL_ACCOUNT_KEY, ValueFrom: !Sub "${KpPaySecretArn}:virtualAccountKey::" }
            - { Name: KP_PAY_PAYOUT_KEY, ValueFrom: !Sub "${KpPaySecretArn}:payoutKey::" }
            - { Name: KP_PAY_BASE_URL, ValueFrom: !Sub "${KpPaySecretArn}:baseUrl::" }
            - { Name: WEBHOOK_MASTER_SECRET, ValueFrom: !Ref WebhookMasterSecretArn }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/${EnvironmentName}/api"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck: { Command: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 30 }
  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-migration"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: migrate
          Image: !Ref MigrationImage
          Essential: true
          Secrets: [{ Name: DATABASE_URL, ValueFrom: !Ref DatabaseUrlSecretArn }]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MigrationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Sub "${EnvironmentName}"
      ServiceName: api
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration: { MinimumHealthyPercent: 100, MaximumPercent: 200, DeploymentCircuitBreaker: { Enable: true, Rollback: true } }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref AppSubnetA, !Ref AppSubnetC]
          SecurityGroups: [!Ref ApplicationSecurityGroup]
      LoadBalancers: [{ ContainerName: api, ContainerPort: 8080, TargetGroupArn: !Ref ApiTargetGroup }]
  ApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref MaxCapacity
      MinCapacity: !Ref MinCapacity
      ResourceId: !Join ["/", [service, !Ref EnvironmentName, !GetAtt ApiService.Name]]
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  ApiCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${EnvironmentName}-api-cpu-60"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }
        ScaleInCooldown: 120
        ScaleOutCooldown: 60

Outputs:
  LoadBalancerDnsName: { Value: !GetAtt LoadBalancer.DNSName }
  LoadBalancerCanonicalHostedZoneId: { Value: !GetAtt LoadBalancer.CanonicalHostedZoneID }
  TargetGroupArn: { Value: !Ref ApiTargetGroup }
  ApiTaskDefinitionArn: { Value: !Ref ApiTaskDefinition }
  MigrationTaskDefinitionArn: { Value: !Ref MigrationTaskDefinition }
